version: '3.9'
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: venue_rental
      POSTGRES_USER: venue_admin
      POSTGRES_PASSWORD: securepassword
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env.example
    ports:
      - '4000:4000'
    depends_on:
      - postgres
      - redis
    volumes:
      - ./packages/backend:/usr/src/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file:
      - .env.example
    ports:
      - '3000:3000'
    depends_on:
      - backend
    volumes:
      - ./packages/frontend:/usr/src/app

volumes:
  postgres-data:
