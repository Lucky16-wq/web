services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: venue_rental
      POSTGRES_USER: venue_admin
      POSTGRES_PASSWORD: securepassword
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venue_admin -d venue_rental"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: # Use .env for actual values, .env.example is a template
      - .env
    environment:
      - DATABASE_URL=postgresql://venue_admin:securepassword@postgres:5432/venue_rental
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./packages/backend:/usr/src/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file: # Use .env for actual values, .env.example is a template
      - .env
    ports:
      - '3000:3000'
    depends_on:
      - backend
    volumes:
      - ./packages/frontend:/usr/src/app

volumes:
  postgres-data:
